<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tatuadores — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <div>
        <a href="clientes.html" class="text-light me-3">Clientes</a>
        <a href="senioridade.html" class="text-light me-3">Senioridade</a>
        <a href="estilos.html" class="text-light me-3">Estilos</a>
        <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
        <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
        <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <h1 class="mb-4">Gerenciar Tatuadores</h1>

  <form id="form-tatuador" class="mb-4">
    <div class="row g-3">
      <div class="col-md-5">
        <input type="text" id="nome" class="form-control" placeholder="Nome" required>
      </div>
      <div class="col-md-6">
        <input type="text" id="especialidade" class="form-control" placeholder="Especialidade" required>
      </div>
      <div class="col-md-1">
        <button type="submit" class="btn btn-success w-100">Salvar</button>
      </div>
    </div>
  </form>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Especialidade</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-tatuadores"></tbody>
  </table>

  <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>
</body>
</html>
